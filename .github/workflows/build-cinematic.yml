name: Build cinematic assets
on:
  push:
    branches: [cinematic-demo]
    paths:
      - 'tools/build_web_cinematic.py'
      - 'tools/build_topdown.py'
      - '.github/workflows/build-cinematic.yml'
permissions:
  contents: write
concurrency:
  group: cinematic-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinematic-demo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 ffmpeg
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless vtk
          npm install --no-save @gltf-transform/core @gltf-transform/extensions draco3dgltf
      - name: Decode the same Porsche 911 Carrera 4S asset
        run: |
          mkdir -p .cinematic-build
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/playcanvas/web-components/main/examples/assets/models/porsche-911-carrera-4s.glb \
            -o .cinematic-build/porsche-draco.glb
          node --input-type=module <<'JS'
          import { NodeIO } from '@gltf-transform/core';
          import { ALL_EXTENSIONS } from '@gltf-transform/extensions';
          import draco3d from 'draco3dgltf';
          const io = new NodeIO()
            .registerExtensions(ALL_EXTENSIONS)
            .registerDependencies({'draco3d.decoder': await draco3d.createDecoderModule()});
          const doc = await io.read('.cinematic-build/porsche-draco.glb');
          const draco = doc.getRoot().listExtensionsUsed().find(e => e.extensionName === 'KHR_draco_mesh_compression');
          if (draco) draco.dispose();
          await io.write('.cinematic-build/porsche-uncompressed.glb', doc);
          JS
          test -s .cinematic-build/porsche-uncompressed.glb
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_web_cinematic.py')
          s=p.read_text()
          old="CAR=get('https://raw.githubusercontent.com/esc5221/drive-game/main/public/models/911.glb','911.glb')"
          new="CAR=Path('.cinematic-build/porsche-uncompressed.glb')"
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY
      - name: Render website assets from selected source assets
        run: |
          xvfb-run -a python tools/build_topdown.py
          test $(stat -c%s assets/cinematic/porsche-top.webp) -gt 10000
          test $(stat -c%s assets/cinematic/road-top.webp) -gt 50000
      - name: Commit rendered assets
        run: |
          git restore tools/build_web_cinematic.py || true
          git config user.name 'Yellow Drive Asset Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/cinematic/*.webp
          if git diff --cached --quiet; then
            echo 'No asset changes.'
          else
            git commit -m 'Render top-down Porsche driving assets'
            git pull --rebase origin cinematic-demo
            git push origin HEAD:cinematic-demo
          fi
