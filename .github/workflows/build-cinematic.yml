name: Build cinematic assets
on:
  push:
    branches: [cinematic-demo]
    paths:
      - 'tools/build_web_cinematic.py'
      - '.github/workflows/build-cinematic.yml'
permissions:
  contents: write
concurrency:
  group: cinematic-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinematic-demo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 ffmpeg blender
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless vtk
      - name: Prepare the same Porsche 911 Carrera 4S without Draco compression
        run: |
          mkdir -p .cinematic-build
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/playcanvas/web-components/main/examples/assets/models/porsche-911-carrera-4s.glb \
            -o .cinematic-build/porsche-draco.glb
          blender --background --python-expr "import bpy; bpy.ops.import_scene.gltf(filepath=r'${GITHUB_WORKSPACE}/.cinematic-build/porsche-draco.glb'); bpy.ops.export_scene.gltf(filepath=r'${GITHUB_WORKSPACE}/.cinematic-build/porsche-uncompressed.glb', export_format='GLB', export_draco_mesh_compression_enable=False)"
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_web_cinematic.py')
          s=p.read_text()
          old="CAR=get('https://raw.githubusercontent.com/esc5221/drive-game/main/public/models/911.glb','911.glb')"
          new="CAR=Path('.cinematic-build/porsche-uncompressed.glb')"
          if old not in s:
              raise SystemExit('Expected Porsche source line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Render website assets from selected source assets
        run: xvfb-run -a python tools/build_web_cinematic.py
      - name: Commit rendered assets
        run: |
          git restore tools/build_web_cinematic.py
          git config user.name 'Yellow Drive Asset Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/cinematic/*.webp
          if git diff --cached --quiet; then
            echo 'No asset changes.'
          else
            git commit -m 'Render cinematic assets from selected source files'
            git pull --rebase origin cinematic-demo
            git push origin HEAD:cinematic-demo
          fi
